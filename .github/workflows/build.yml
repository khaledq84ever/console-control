name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Silently pre-install ViGEmBus
        shell: pwsh
        run: |
          # vgamepad's own setup.py launches an INTERACTIVE `msiexec /i` (no
          # /quiet) to install ViGEmBus if it isn't already present, which
          # hangs forever on a runner with no one to click through the wizard.
          # Installing it silently first makes vgamepad's own registry check
          # see it's already there and skip that interactive step entirely.
          # Pinned to 1.17.333 (not "latest") because that's the exact
          # version vgamepad's setup.py checks the registry for — matching it
          # exactly guarantees the check passes. This is also the version
          # vgamepad bundles its own copy of, so it's not going anywhere.
          Invoke-WebRequest -Uri "https://github.com/nefarius/ViGEmBus/releases/download/setup-v1.17.333/ViGEmBusSetup_x64.msi" -OutFile "$env:TEMP\ViGEmBusSetup_x64.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\ViGEmBusSetup_x64.msi`" /quiet /norestart" -Wait

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit test controller_parsers.py (pure byte math, no hardware needed)
        run: python tests/test_parsers.py

      - name: End-to-end pipeline test (fake HID device + fake ViGEmBus pad)
        run: python tests/test_e2e.py

      - name: Smoke-test --list on a runner with no controller attached
        shell: pwsh
        run: |
          python main.py --list
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            Write-Error "expected exit code 1 (no controller found), got $code"
            exit 1
          }
          Write-Host "--list correctly reported no controller (exit 1) without crashing"
          exit 0

      - name: Build exe with PyInstaller
        run: pyinstaller --onefile --console --name ConsoleControl main.py

      - name: Smoke-test the built exe launches and reports cleanly with no controller
        shell: pwsh
        run: |
          $out = & "dist\ConsoleControl.exe" --list 2>&1
          Write-Host $out
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            Write-Error "expected exe --list to exit 1 (no controller), got $code"
            exit 1
          }
          Write-Host "exe smoke test passed"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ConsoleControl-windows-exe
          path: dist/ConsoleControl.exe
